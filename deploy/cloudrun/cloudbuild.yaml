# `gcloud builds submit --tag` insists on a root Dockerfile, so the build goes through this config,
# which points docker at deploy/cloudrun/Dockerfile. The context is the repo root filtered by
# .gcloudignore (no secrets, no node_modules, no contracts/lib).
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/cloudrun/Dockerfile", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
substitutions:
  _IMAGE: "us-central1-docker.pkg.dev/zentis-cg1-2026/zentis/publisher:dev"
options:
  logging: CLOUD_LOGGING_ONLY
