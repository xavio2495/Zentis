specVersion: 1.0.0
description: Zentis position fills and published references on arbitrum-sepolia, keyed by positionId.
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Aqua
    network: arbitrum-sepolia
    source:
      address: "0x8f4f807c72a2bfab4024e783f68fc714d0ce2bbe"
      abi: Aqua
      startBlock: 306789142
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - Position
        - Fill
        - Reference
        - RejectedReference
        - StrategyLink
      abis:
        - name: Aqua
          file: ./abis/Aqua.json
        - name: ZentisRouter
          file: ./abis/ZentisRouter.json
        - name: ZentisRefRegistry
          file: ./abis/ZentisRefRegistry.json
      eventHandlers:
        - event: Shipped(address,address,bytes32,bytes)
          handler: handleShipped
        - event: Docked(address,address,bytes32)
          handler: handleDocked
        - event: Pushed(address,address,bytes32,address,uint256)
          handler: handlePushed
        - event: Pulled(address,address,bytes32,address,uint256)
          handler: handlePulled
  - kind: ethereum
    name: ZentisRouter
    network: arbitrum-sepolia
    source:
      address: "0xfc603336a7b797f2d7eba03ed69734fad9ea521b"
      abi: ZentisRouter
      startBlock: 306789142
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - Position
        - Fill
        - Reference
        - RejectedReference
        - StrategyLink
      abis:
        - name: Aqua
          file: ./abis/Aqua.json
        - name: ZentisRouter
          file: ./abis/ZentisRouter.json
        - name: ZentisRefRegistry
          file: ./abis/ZentisRefRegistry.json
      eventHandlers:
        - event: Swapped(bytes32,address,address,address,address,uint256,uint256)
          handler: handleSwapped
  - kind: ethereum
    name: ZentisRefRegistry
    network: arbitrum-sepolia
    source:
      address: "0xB7e37E396bBB785c346D1909231a9B3D2707Cd32"
      abi: ZentisRefRegistry
      startBlock: 306789142
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - Position
        - Fill
        - Reference
        - RejectedReference
        - StrategyLink
      abis:
        - name: Aqua
          file: ./abis/Aqua.json
        - name: ZentisRouter
          file: ./abis/ZentisRouter.json
        - name: ZentisRefRegistry
          file: ./abis/ZentisRefRegistry.json
      eventHandlers:
        - event: ZentisRefUpdated(indexed bytes32,uint128,int16,uint40,uint32)
          handler: handleRefUpdated
        - event: ZentisRefRejected(indexed bytes32,string)
          handler: handleRefRejected
