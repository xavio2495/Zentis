# Maps the secret ID the workflow requests with `runtime.getSecret({ id })` to the environment
# variable holding its value. In a Confidential Workflow the Vault DON releases these directly into
# the attested enclave; they are never in plaintext to node operators or in Workflow DON memory.
#
# CONGESTION_BPS is how hard the maker backs off a leg the rest of the venue already leans into.
# The crowding it responds to is computed from public Aqua events and is deliberately not secret;
# the response function is, because it is the maker's read of when a corner is not worth fighting for.
#
# GRAPH_API_KEY reaches The Graph's decentralised gateway, where the volatility series is read from
# the Uniswap v3 mainnet subgraph. It is a billing credential, not a model secret: the series it
# fetches is public, and it is held in the enclave so that a node operator cannot spend the quota.
#
# KAPPA_BPS is the gain that turns an inventory imbalance into a quote concession — how far the maker
# will move price to shed inventory. It is the one number in this system that is genuinely the
# maker's edge: an operator who could read it would know the size and direction of every rebalance
# before it happened. The pool prices and Aqua balances the workflow reads are public on-chain data
# and are deliberately not treated as secret.
secretsNames:
    KAPPA_BPS:
        - SECRET_KAPPA_BPS
    KAPPA_BOOK_BPS:
        - SECRET_KAPPA_BOOK_BPS
    CONGESTION_BPS:
        - SECRET_CONGESTION_BPS
    ONEINCH_API_KEY:
        - 1INCH_API_KEY
    GRAPH_API_KEY:
        - GRAPH_API_KEY
