# ==========================================================================
# CRE PROJECT SETTINGS
# ==========================================================================
# One RPC per leg of the position. The chain names are the CRE chain-selector
# names, not our own: base-sepolia is ethereum-testnet-sepolia-base-1
# (10344971235874465080), arbitrum-sepolia is
# ethereum-testnet-sepolia-arbitrum-1 (3478487238524512106), and Ethereum
# Sepolia is plain ethereum-testnet-sepolia (16015286601757825753).
staging-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia-base-1
      url: https://sepolia.base.org
    - chain-name: ethereum-testnet-sepolia-arbitrum-1
      url: https://sepolia-rollup.arbitrum.io/rpc
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com

# ==========================================================================
production-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia-base-1
      url: https://sepolia.base.org
    - chain-name: ethereum-testnet-sepolia-arbitrum-1
      url: https://sepolia-rollup.arbitrum.io/rpc
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com
